plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose' version '2.2.10'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}
def neshanApiKey = localProperties.getProperty("NESHAN_API_KEY") ?: (System.getenv("NESHAN_API_KEY") ?: "")

android {
    namespace 'com.alps.minimal'
    compileSdk 34

    buildFeatures {
        compose true
        buildConfig true
    }

    defaultConfig {
        applicationId 'com.alps.minimal'
        minSdk 23
        targetSdk 28
        versionCode 8
        versionName '0.5.1'
        buildConfigField "String", "NESHAN_API_KEY", "\"${neshanApiKey.replace("\\", "\\\\").replace("\"", "\\\"")}\""
        manifestPlaceholders = [NESHAN_API_KEY: neshanApiKey]
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.06.00')
    implementation 'androidx.activity:activity-compose:1.9.0'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.3'
    implementation 'org.neshan.maplibre:android-sdk-opengl:13.4.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
}
