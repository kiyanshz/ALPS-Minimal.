plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.alps.minimal'
    compileSdk 34

    defaultConfig {
        applicationId 'com.alps.minimal'
        minSdk 23
        targetSdk 28
        versionCode 6
        versionName '0.4.0'
        manifestPlaceholders = [NESHAN_API_KEY: (System.getenv("NESHAN_API_KEY") ?: "")]
    }
}

dependencies {
    implementation 'org.neshan.maplibre:android-sdk-opengl:13.4.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
}
