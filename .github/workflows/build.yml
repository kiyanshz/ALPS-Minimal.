name: Build ALPS Minimal APK

on:
  push:
    paths:
      - 'ALPS-Minimal-source-v0.1.zip'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        run: |
          sdkmanager --licenses
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Extract project
        run: |
          test -f ALPS-Minimal-source-v0.1.zip
          unzip -q ALPS-Minimal-source-v0.1.zip -d extracted
          test -f extracted/ALPS-Minimal/settings.gradle || test -f extracted/ALPS-Minimal/settings.gradle.kts
          test -f extracted/ALPS-Minimal/app/build.gradle || test -f extracted/ALPS-Minimal/app/build.gradle.kts

      - name: Inspect application source
        run: |
          find extracted/ALPS-Minimal/app/src/main -type f -maxdepth 8 -print
          for f in extracted/ALPS-Minimal/app/src/main/java/com/alps/minimal/MainActivity.kt extracted/ALPS-Minimal/app/build.gradle extracted/ALPS-Minimal/app/src/main/AndroidManifest.xml extracted/ALPS-Minimal/build.gradle extracted/ALPS-Minimal/settings.gradle; do
            if [ -f "$f" ]; then echo "===== $f ====="; sed -n '1,1000p' "$f"; fi
          done

      - name: Align Kotlin JVM target with Java
        shell: bash
        run: |
          if [ -f extracted/ALPS-Minimal/app/build.gradle ]; then
            cat >> extracted/ALPS-Minimal/app/build.gradle <<'EOF'

          // Keep Kotlin bytecode compatible with the app's Java 8 target.
          tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
              kotlinOptions.jvmTarget = "1.8"
          }
          EOF
          elif [ -f extracted/ALPS-Minimal/app/build.gradle.kts ]; then
            cat >> extracted/ALPS-Minimal/app/build.gradle.kts <<'EOF'

          // Keep Kotlin bytecode compatible with the app's Java 8 target.
          tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
              kotlinOptions.jvmTarget = "1.8"
          }
          EOF
          else
            echo "App Gradle build file not found"
            exit 1
          fi

      - name: Build debug APK
        run: gradle -p extracted/ALPS-Minimal assembleDebug

      - name: Verify APK
        run: test -s extracted/ALPS-Minimal/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ALPS-Minimal-APK
          path: extracted/ALPS-Minimal/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
