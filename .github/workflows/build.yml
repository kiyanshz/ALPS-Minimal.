name: Build ALPS Minimal APK

on:
  push:
    paths:
      - 'ALPS-Minimal-source-v0.1.zip'
      - 'overrides/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        run: |
          sdkmanager --licenses
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract project
        run: |
          test -f ALPS-Minimal-source-v0.1.zip
          unzip -q ALPS-Minimal-source-v0.1.zip -d extracted
          test -f extracted/ALPS-Minimal/settings.gradle || test -f extracted/ALPS-Minimal/settings.gradle.kts
          test -f extracted/ALPS-Minimal/app/build.gradle || test -f extracted/ALPS-Minimal/app/build.gradle.kts

      - name: Align Kotlin toolchain with Neshan SDK
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path("extracted/ALPS-Minimal")
          suffixes = {".gradle", ".kts", ".toml"}
          files = [p for p in root.rglob("*") if p.is_file() and
                   (p.name.endswith(".gradle.kts") or p.suffix in suffixes)]

          changed = []
          for path in files:
              content = path.read_text()
              updated = content.replace("1.9.0", "2.2.10").replace("1.9.22", "2.2.10")
              if updated != content:
                  path.write_text(updated)
                  changed.append(str(path))

          for path in changed:
              print(f"Updated Kotlin version in {path}")

          if not changed:
              print("No literal 1.9.0 found in Gradle/TOML files; checking version declarations:")
              for path in files:
                  for number, line in enumerate(path.read_text().splitlines(), 1):
                      if "kotlin" in line.lower() or "1.9.0" in line or "1.9.22" in line:
                          print(f"{path}:{number}: {line.strip()}")
          PY

      - name: Apply app source updates
        run: |
          cp overrides/MainActivity.kt extracted/ALPS-Minimal/app/src/main/java/com/alps/minimal/MainActivity.kt
          cp overrides/CarPlayLauncher.kt extracted/ALPS-Minimal/app/src/main/java/com/alps/minimal/CarPlayLauncher.kt
          cp overrides/NowPlayingRepo.kt extracted/ALPS-Minimal/app/src/main/java/com/alps/minimal/NowPlayingRepo.kt
          cp overrides/BluetoothScreen.kt extracted/ALPS-Minimal/app/src/main/java/com/alps/minimal/BluetoothScreen.kt
          cp overrides/app-build.gradle extracted/ALPS-Minimal/app/build.gradle
          cp overrides/AndroidManifest.xml extracted/ALPS-Minimal/app/src/main/AndroidManifest.xml
          mkdir -p extracted/ALPS-Minimal/app/src/main/java/com/alps/minimal
          cp overrides/AppAdapter.kt extracted/ALPS-Minimal/app/src/main/java/com/alps/minimal/AppAdapter.kt
          mkdir -p extracted/ALPS-Minimal/app/src/main/res/values extracted/ALPS-Minimal/app/src/main/res/drawable extracted/ALPS-Minimal/app/src/main/res/layout
          cp overrides/res/values/colors.xml extracted/ALPS-Minimal/app/src/main/res/values/colors.xml
          cp overrides/res/drawable/*.xml extracted/ALPS-Minimal/app/src/main/res/drawable/
          cp overrides/res/layout/*.xml extracted/ALPS-Minimal/app/src/main/res/layout/

      - name: Download pinned Liquid Glass assets
        shell: bash
        run: |
          set -euo pipefail
          ASSET_DIR="extracted/ALPS-Minimal/app/src/main/res/drawable-nodpi"
          mkdir -p "$ASSET_DIR"
          ICON_BASE="https://raw.githubusercontent.com/SysAdminDoc/iOSIconPack/db0ccf25ff695a076eee16833fd868a1a454cda6/app/src/main/res/drawable-xxxhdpi"
          for icon in phone maps music settings messages camera; do
            curl --fail --location --retry 3 --retry-delay 2 "$ICON_BASE/ios26_lg_${icon}.png" -o "$ASSET_DIR/ios26_lg_${icon}.png"
          done
          curl --fail --location --retry 3 --retry-delay 2 "https://images.unsplash.com/photo-1754806424644-091920f33989?fm=jpg&fit=crop&w=2560&h=1440&q=88" -o "$ASSET_DIR/alps_wallpaper.jpg"
          mkdir -p "extracted/ALPS-Minimal/app/src/main/assets"
          cp overrides/THIRD_PARTY_NOTICES.md "extracted/ALPS-Minimal/app/src/main/assets/THIRD_PARTY_NOTICES.md"
          file "$ASSET_DIR"/*
          test -s "$ASSET_DIR/alps_wallpaper.jpg"

      - name: Align Kotlin JVM target with Java
        shell: bash
        run: |
          if [ -f extracted/ALPS-Minimal/app/build.gradle ]; then
            cat >> extracted/ALPS-Minimal/app/build.gradle <<'EOF'

          // Keep Kotlin bytecode compatible with the app's Java 8 target.
          tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
              kotlinOptions.jvmTarget = "1.8"
          }
          EOF
          elif [ -f extracted/ALPS-Minimal/app/build.gradle.kts ]; then
            cat >> extracted/ALPS-Minimal/app/build.gradle.kts <<'EOF'

          // Keep Kotlin bytecode compatible with the app's Java 8 target.
          tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
              kotlinOptions.jvmTarget = "1.8"
          }
          EOF
          else
            echo "App Gradle build file not found"
            exit 1
          fi

      - name: Build debug APK
        env:
          NESHAN_API_KEY: ${{ secrets.NESHAN_API_KEY }}
        run: |
          test -n "$NESHAN_API_KEY" || { echo "NESHAN_API_KEY repository secret is missing"; exit 1; }
          gradle -p extracted/ALPS-Minimal assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="extracted/ALPS-Minimal/app/build/outputs/apk/debug/app-debug.apk"
          AAPT="$ANDROID_HOME/build-tools/34.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          "$AAPT" dump badging "$APK" | grep -F "package: name='com.alps.minimal'"
          "$APKSIGNER" verify "$APK"
          "$AAPT" dump resources "$APK" | grep -q "alps_wallpaper"
          "$AAPT" dump resources "$APK" | grep -q "ios26_lg_maps"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ALPS-Minimal-APK
          path: extracted/ALPS-Minimal/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
