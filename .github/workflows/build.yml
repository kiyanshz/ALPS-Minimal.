name: Build ALPS Minimal APK

on:
  push:
    paths:
      - 'ALPS-Minimal-source-v0.1.zip'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:

          cmdline-tools-version: 11076708

          accept-android-sdk-licenses: true

      - name: Install Android SDK
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Extract project
        run: unzip ALPS-Minimal-source-v0.1.zip -d extracted

      - name: Build APK
        run: gradle -p extracted/ALPS-Minimal assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ALPS-Minimal-APK
          path: extracted/ALPS-Minimal/app/build/outputs/apk/debug/app-debug.apk
