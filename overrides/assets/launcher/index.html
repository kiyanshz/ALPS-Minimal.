<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>ALPS</title>
<style>
:root{--bg:#000;--text:#fff;--dim:rgba(255,255,255,.55);--glass:rgba(255,255,255,.12)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;width:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Vazirmatn","Segoe UI",Tahoma,sans-serif;overflow:hidden}
.screen{height:100%;width:100%;display:flex;direction:ltr;background:radial-gradient(120% 90% at 70% 0%,#1b2a4a 0%,#0a0f1c 55%,#000 100%)}
.side{width:clamp(76px,12vw,150px);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:18px 0;background:rgba(0,0,0,.35)}
.clock{text-align:center;font-weight:600;font-size:clamp(19px,2.6vw,32px);letter-spacing:.5px;white-space:nowrap}
.clock small{display:block;font-size:.43em;font-weight:500;color:var(--dim);margin-top:3px}
.sbtn{width:clamp(48px,6.5vw,78px);aspect-ratio:1;border-radius:50%;background:var(--glass);display:grid;place-items:center;border:0;color:#fff;margin:8px 0;transition:transform .12s,background .12s}
.sbtn:active{transform:scale(.92);background:rgba(255,255,255,.25)}
.sbtn svg{width:46%;height:46%}
.main{flex:1;min-width:0;display:flex;flex-direction:column;padding:3vh 3vw 2vh}
.grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));gap:1.5vh 2vw;align-items:center;justify-items:center}
.app{min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1vh;background:none;border:0;color:var(--text);font:inherit;cursor:pointer}
.ico{width:clamp(58px,10vw,132px);aspect-ratio:1;border-radius:23%;display:grid;place-items:center;box-shadow:0 6px 20px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.25);transition:transform .12s}
.app:active .ico{transform:scale(.9)}
.ico svg{width:58%;height:58%;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ico svg .f{fill:#fff;stroke:none}
.lbl{font-size:clamp(11px,1.55vw,19px);font-weight:500;direction:rtl;white-space:nowrap}
.dots{display:flex;gap:10px;justify-content:center;padding:1vh 0}
.dots i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.3)}
.dots i.on{background:#fff}
@media(max-height:420px){.side{padding:8px 0}.main{padding-top:1vh;padding-bottom:1vh}.grid{gap:.6vh 1.5vw}.ico{width:clamp(50px,8vw,88px)}.app{gap:.4vh}.lbl{font-size:11px}.dots{padding:0}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="screen">
  <aside class="side">
    <div class="clock"><span id="t">12:00</span><small id="d"></small></div>
    <div>
      <button class="sbtn" onclick="launchApp('home')" aria-label="خانه"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg></button>
      <button class="sbtn" onclick="launchApp('music')" aria-label="در حال پخش"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M5 9v6M9 5v14M13 8v8M17 4v16M21 10v4"/></svg></button>
      <button class="sbtn" onclick="launchApp('maps')" aria-label="نقشه"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 17-7-4-7 4z"/></svg></button>
    </div>
  </aside>
  <main class="main">
    <section class="grid" id="grid"></section>
    <div class="dots"><i class="on"></i></div>
  </main>
</div>
<script>
const APPS=[
 {id:'maps',n:'نقشه',c:['#5ee07a','#1fa24a'],g:'<path d="M12 21s-6-5.6-6-10a6 6 0 1112 0c0 4.4-6 10-6 10z"/><circle cx="12" cy="11" r="2.2" class="f"/>'},
 {id:'music',n:'موسیقی',c:['#ff5f7e','#e8203f'],g:'<path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5" class="f"/><circle cx="16.5" cy="16" r="2.5" class="f"/>'},
 {id:'phone',n:'تماس',c:['#4be07a','#16a34a'],g:'<path d="M5 4h4l2 5-2.5 1.5a11 11 0 005 5L15 13l5 2v4a2 2 0 01-2 2A15 15 0 013 6a2 2 0 012-2z" class="f"/>'},
 {id:'messages',n:'پیام‌ها',c:['#5ee07a','#22b455'],g:'<path d="M4 5h16v11H9l-5 4z" class="f"/>'},
 {id:'radio',n:'رادیو',c:['#ff9f43','#f2630f'],g:'<rect x="3" y="8" width="18" height="12" rx="3"/><path d="M7 8l10-5"/><circle cx="16" cy="14" r="2.4"/><path d="M6.5 12h4M6.5 15h4"/>'},
 {id:'video',n:'ویدیو',c:['#7a7cff','#4a3fe0'],g:'<rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9.5v5l4.5-2.5z" class="f"/>'},
 {id:'camera',n:'دوربین',c:['#9aa3b2','#586174'],g:'<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13.5" r="3.3"/>'},
 {id:'bluetooth',n:'بلوتوث',c:['#4aa8ff','#1a6fe0'],g:'<path d="M7 7l10 10-5 4V3l5 4L7 17"/>'},
 {id:'weather',n:'هوا',c:['#58c4ff','#2f7fe6'],g:'<circle cx="9" cy="9" r="3.5" class="f"/><path d="M9 2v1.5M2 9h1.5M4 4l1 1M14 4l-1 1"/><path d="M8 19h9a3.5 3.5 0 000-7 5 5 0 00-9.5 1.5A2.8 2.8 0 008 19z" class="f"/>'},
 {id:'calendar',n:'تقویم',c:['#ffffff','#d9dde5'],g:'<rect x="4" y="5" width="16" height="15" rx="3" stroke="#e8203f"/><path d="M4 10h16M8 3v4M16 3v4" stroke="#e8203f"/><text x="12" y="17.2" text-anchor="middle" font-size="7" font-weight="700" fill="#222" stroke="none" font-family="system-ui">5</text>'},
 {id:'files',n:'فایل‌ها',c:['#ffd24d','#f0a30a'],g:'<path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2z" class="f"/>'},
 {id:'settings',n:'تنظیمات',c:['#a7adba','#636b7a'],g:'<circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M18.7 5.3l-2.1 2.1M7.4 16.6l-2.1 2.1"/>'}
];
const grid=document.getElementById('grid');
grid.innerHTML=APPS.map(a=>'<button class="app" onclick="launchApp(\''+a.id+'\')"><div class="ico" style="background:linear-gradient(160deg,'+a.c[0]+','+a.c[1]+')"><svg viewBox="0 0 24 24" '+(a.id==='calendar'?'style="stroke:none"':'')+'>'+a.g+'</svg></div><span class="lbl">'+a.n+'</span></button>').join('');
function launchApp(id){
  if(window.Android&&Android.openApp){Android.openApp(id);return}
  console.log('open',id);
}
function tick(){
  const n=new Date();
  document.getElementById('t').textContent=n.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
  document.getElementById('d').textContent=n.toLocaleDateString('fa-IR',{weekday:'short',day:'numeric',month:'short'});
}
tick();setInterval(tick,15000);
</script>
</body>
</html>
